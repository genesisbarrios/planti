; Planti firmware for the LILYGO T-Display-S3 AMOLED 1.91" or the original
; T-Display-S3 (both ESP32-S3), with an Adafruit STEMMA Soil Sensor
; (product 4026, seesaw over I2C).
;
; Versions are pinned to what LILYGO tests: platform espressif32@6.5.0 ships
; arduino-esp32 2.0.14, and GFX Library for Arduino 1.4.2 is the version
; bundled in LILYGO's T-Display-S3 repository.

[platformio]
default_envs = device

[env]
platform = espressif32@6.5.0
; Board definition from LILYGO's repository (MIT), in ./boards.
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
upload_protocol = esptool
lib_deps =
    moononournation/GFX Library for Arduino@1.4.2
    adafruit/Adafruit seesaw Library@1.7.9
    bblanchon/ArduinoJson@7.2.1
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DPLANTI_FIRMWARE_VERSION=\"0.1.0\"

; T-Display-S3 AMOLED 1.91": real sensor, uploads telemetry.
[env:device]
build_flags =
    ${env.build_flags}
    -DPLANTI_BOARD_AMOLED=1

; Bench mode: no sensor needed. Generates clearly labeled SIMULATED values for
; testing the display and Wi-Fi, and never uploads them (the server rejects
; simulated data on the hardware endpoint anyway).
[env:bench]
build_flags =
    ${env.build_flags}
    -DPLANTI_BOARD_AMOLED=1
    -DPLANTI_BENCH_SENSOR=1

; Original T-Display-S3 (ST7789 LCD)
[env:tdisplay]

[env:tdisplay-bench]
build_flags =
    ${env.build_flags}
    -DPLANTI_BENCH_SENSOR=1
